<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shepherd Workbench</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --text: #1b1f24; --muted: #5d6673; --line: #dde1e6; --hover: #f0f3f7;
    --accent: #2f6fdb; --accent-soft: #e6eefc;
    --flag: #c0392b; --flag-soft: #fdecea; --ok: #1f8a4c; --ok-soft: #e6f5ec; --warn: #b26a00; --warn-soft: #fff3df;
    --machine: #2f6fdb; --radius: 8px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --panel: #1a1e24; --text: #e6e9ed; --muted: #9aa3ae; --line: #2c323a; --hover: #222831;
      --accent: #6b9cf0; --accent-soft: #1f2a3d;
      --flag: #ef6b5b; --flag-soft: #3a1f1c; --ok: #4cc27f; --ok-soft: #173024; --warn: #e0a040; --warn-soft: #3a2c14;
      --machine: #6b9cf0;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  button, select, input { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  button.link { border: none; background: none; color: var(--accent); padding: 0 4px; }
  select, input[type=text], input[type=date], input[type=search], textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; color: inherit; }
  input[type=text]:focus, input[type=date]:focus, input[type=search]:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  textarea { width: 100%; resize: vertical; min-height: 60px; }
  button.danger { color: var(--flag); border-color: var(--flag); }
  button.ok { color: var(--ok); border-color: var(--ok); }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 12px; }

  header.top { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header.top h1 { font-size: 16px; margin: 0; }
  header.top h1 a { color: inherit; text-decoration: none; }
  header.top .counts { display: flex; gap: 8px; }
  header.top .spacer { flex: 1; }
  header.top nav { display: flex; gap: 4px; }
  header.top nav a { padding: 4px 10px; border-radius: 6px; text-decoration: none; color: var(--muted); }
  header.top nav a[aria-current=page] { background: var(--accent-soft); color: var(--accent); }
  .pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px; border: 1px solid var(--line); white-space: nowrap; }
  .pill.flag { color: var(--flag); border-color: var(--flag); background: var(--flag-soft); }
  .pill.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
  .pill.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
  .pill.info { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .queue { padding: 16px; max-width: 1100px; width: 100%; margin: 0 auto; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .tabs { display: flex; gap: 4px; }
  .tabs button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hover); }
  tbody tr:last-child td { border-bottom: none; }
  .empty { padding: 40px; text-align: center; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }

  .bench { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .bench-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .bench-head .title { font-weight: 600; }
  .bench-head .spacer { flex: 1; }
  .banner { padding: 8px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .banner.flag { background: var(--flag-soft); }
  .banner.warn { background: var(--warn-soft); }
  .banner.ok { background: var(--ok-soft); }
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(360px, 1fr); }
  .viewer { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  .pagebar { display: flex; gap: 4px; padding: 8px 12px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--panel); }
  .pagebar button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .pagebar button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--flag); margin-left: 4px; vertical-align: 1px; }
  .scroll { flex: 1; overflow: auto; padding: 16px; }
  .page { position: relative; margin: 0 auto; max-width: 980px; box-shadow: 0 1px 4px rgba(0,0,0,.2); background: #fff; }
  .page img { display: block; width: 100%; height: auto; user-select: none; }
  .box { position: absolute; border: 1.5px solid transparent; border-radius: 2px; cursor: pointer; }
  .box.machine { border-color: color-mix(in srgb, var(--machine) 45%, transparent); background: color-mix(in srgb, var(--machine) 6%, transparent); }
  .box.flag { border-color: var(--flag); background: color-mix(in srgb, var(--flag) 14%, transparent); }
  .box.resolved { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .box.changed { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .box.blank { border-color: color-mix(in srgb, var(--muted) 35%, transparent); border-style: dashed; }
  .box.active { outline: 3px solid var(--accent); outline-offset: 1px; z-index: 2; animation: pulse 1.2s ease-out 1; }
  @keyframes pulse { 0% { outline-offset: 8px; } 100% { outline-offset: 1px; } }

  .fields { min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
  .fieldbar { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .fieldbar .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .fieldbar .row input[type=text] { flex: 1; min-width: 120px; }
  .filters button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress > span { display: block; height: 100%; width: 0; background: var(--ok); transition: width .2s; }
  .list { flex: 1; overflow: auto; }
  .group-head { position: sticky; top: 0; z-index: 1; background: var(--bg); color: var(--muted); font-size: 12px; font-weight: 600; padding: 4px 12px; border-bottom: 1px solid var(--line); }
  .field { padding: 8px 12px 8px 9px; border-left: 3px solid transparent; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
  .field.active { background: var(--accent-soft); }
  .field.flag { border-left-color: var(--flag); }
  .field.resolved { border-left-color: var(--ok); }
  .field.changed { border-left-color: var(--warn); }
  .field .label { font-weight: 500; }
  .field .label .meta { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .field .control { display: flex; gap: 6px; align-items: center; }
  .field .control input[type=text], .field .control select { flex: 1; min-width: 0; }
  .field .control input[type=checkbox] { width: 18px; height: 18px; }
  .field .hint { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .field .err { color: var(--flag); font-size: 12px; }
  .field.readonly .control input, .field.readonly .control select { pointer-events: none; opacity: .85; }
  .foot { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel); }
  .foot .spacer { flex: 1; }

  dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--text); padding: 0; width: min(640px, 94vw); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog header { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
  dialog .body { padding: 12px 16px; display: grid; gap: 10px; max-height: 60vh; overflow: auto; }
  dialog footer { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
  .doclist { display: grid; gap: 4px; }
  .doclist label { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .doclist label:hover { background: var(--hover); }
  .history li { margin: 2px 0; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: .95; }
  /* cases */
  .toolbar .grow { flex: 1; }
  .kv { display: grid; grid-template-columns: minmax(120px, 38%) 1fr; gap: 6px 10px; align-items: center; }
  .kv .k { color: var(--muted); font-size: 12px; }
  .kv input[type=text], .kv input[type=date], .kv select { width: 100%; min-width: 0; }
  .section { padding: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .section h3 { margin: 0; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .section h3 .spacer { flex: 1; }
  .ptabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .ptabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 10px; color: var(--muted); }
  .ptabs button[aria-pressed=true] { color: var(--accent); border-bottom-color: var(--accent); }
  .pane { flex: 1; overflow: auto; }
  .docbar { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; align-items: center; }
  .docbar button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .doc-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; }
  .doc-row .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
  .crit { border: 1px solid var(--line); border-radius: 6px; padding: 8px; display: grid; gap: 6px; }
  .crit.met { border-left: 3px solid var(--ok); }
  .crit.not_met { border-left: 3px solid var(--flag); }
  .crit.na { border-left: 3px solid var(--muted); }
  .crit .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .seg button[aria-pressed=true].met { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .seg button[aria-pressed=true].not_met { background: var(--flag-soft); border-color: var(--flag); color: var(--flag); }
  .seg button[aria-pressed=true].na { background: var(--hover); border-color: var(--muted); }
  .action { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; }
  .action h4 { margin: 0; font-size: 13px; }
  .checks { display: grid; gap: 4px; font-size: 13px; }
  .checks .bad { color: var(--flag); }
  .checks .good { color: var(--ok); }
  .errs { color: var(--flag); font-size: 12px; display: grid; gap: 2px; }
  .timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .timeline li { display: grid; gap: 2px; padding-left: 10px; border-left: 2px solid var(--line); }
  .timeline .when { font-size: 12px; color: var(--muted); }
  .timeline .note { white-space: pre-wrap; background: var(--bg); border-radius: 6px; padding: 6px 8px; }
  .results { display: grid; gap: 8px; }
  .hit { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 4px; cursor: pointer; }
  .hit:hover { background: var(--hover); }
  .hit .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hit .snip { font-size: 13px; color: var(--muted); }
  .hit mark { background: var(--warn-soft); color: var(--text); border-radius: 2px; }
  .search-grid { display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
  .facets { display: grid; gap: 12px; align-content: start; }
  .facets h4 { margin: 0 0 4px; font-size: 12px; color: var(--muted); }
  .facets button { display: flex; justify-content: space-between; width: 100%; border: none; background: none; padding: 2px 4px; text-align: left; }
  .facets button[aria-pressed=true] { color: var(--accent); font-weight: 600; }
  .filters-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .filters-row label { display: flex; gap: 4px; align-items: center; font-size: 13px; }
  .receipt { font-family: var(--mono); font-weight: 600; letter-spacing: .02em; }
  .decision-box { border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 6px; }
  .decision-box.approved { background: var(--ok-soft); }
  .decision-box.denied { background: var(--flag-soft); }
  .decision-box.withdrawn, .decision-box.closed { background: var(--hover); }
  .pre { white-space: pre-wrap; }
  @media (max-width: 900px) {
    .search-grid { grid-template-columns: 1fr; }
    .split { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
    .viewer { border-right: none; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header class="top">
  <h1><a href="#/">Shepherd · Workbench</a></h1>
  <nav id="nav">
    <a href="#/" data-nav="cases">Cases</a>
    <a href="#/search" data-nav="search">Search</a>
    <a href="#/receipting" data-nav="receipting">Receipting</a>
    <a href="#/workload" data-nav="workload">Workload</a>
  </nav>
  <div class="counts" id="counts"></div>
  <div class="spacer"></div>
  <button class="link" id="user-btn" title="Change your name"></button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<dialog id="user-dlg">
  <form method="dialog">
    <header>Your name</header>
    <div class="body">
      <p class="muted" style="margin:0">Recorded on every receipt, assessment and decision.</p>
      <input type="text" id="user-input" autocomplete="name" required maxlength="64">
      <label><input type="checkbox" id="user-manager"> Manager (assigns cases, manages workers and rules)</label>
    </div>
    <footer><button class="primary" value="ok">Save</button></footer>
  </form>
</dialog>

<dialog id="manual-dlg">
  <form method="dialog">
    <header>Manual receipting</header>
    <div class="body">
      <label>Form type <select id="manual-form"></select></label>
      <div class="muted">Choose a stored document:</div>
      <div class="doclist" id="manual-docs"></div>
    </div>
    <footer><button value="cancel">Cancel</button><button class="primary" value="ok" id="manual-ok" disabled>Open task</button></footer>
  </form>
</dialog>

<dialog id="open-case-dlg">
  <form method="dialog">
    <header id="open-case-title">Open case</header>
    <div class="body">
      <div class="kv" id="open-case-opts"></div>
      <input type="search" id="open-case-filter" placeholder="Filter documents…">
      <div class="doclist" id="open-case-docs"></div>
    </div>
    <footer><button value="cancel">Cancel</button><button class="primary" value="ok" id="open-case-ok" disabled>Open case</button></footer>
  </form>
</dialog>

<dialog id="reason-dlg">
  <form method="dialog">
    <header id="reason-title">Reason</header>
    <div class="body">
      <div class="muted" id="reason-help"></div>
      <textarea id="reason-input" rows="4" maxlength="2000"></textarea>
    </div>
    <footer><button value="cancel">Cancel</button><button class="primary" value="ok">Save</button></footer>
  </form>
</dialog>

<dialog id="form-dlg">
  <form method="dialog">
    <header id="form-title"></header>
    <div class="body" id="form-body"></div>
    <footer><button value="cancel">Cancel</button><button class="primary" value="ok" id="form-ok">Save</button></footer>
  </form>
</dialog>

<dialog id="history-dlg">
  <form method="dialog">
    <header>Task history</header>
    <div class="body"><ul class="history" id="history-list"></ul></div>
    <footer><button value="ok">Close</button></footer>
  </form>
</dialog>

<script>
"use strict";
// ---------- utilities ----------
const $ = (sel, root = document) => root.querySelector(sel);
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(e.dataset, v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600);
}
function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  return Math.floor(s / 86400) + " d ago";
}
const pct = x => x == null ? "" : Math.round(x * 100) + "%";

// ---------- identity ----------
function getUser() { try { return localStorage.getItem("shepherd.user") || ""; } catch (_) { return ""; } }
function setUser(u) { try { localStorage.setItem("shepherd.user", u); } catch (_) {} renderUser(); }
function isManager() { try { return localStorage.getItem("shepherd.roles") === "manager"; } catch (_) { return false; } }
function setManager(on) { try { localStorage.setItem("shepherd.roles", on ? "manager" : ""); } catch (_) {} }
function renderUser() { $("#user-btn").textContent = getUser() ? "Signed in as " + getUser() + (isManager() ? " (manager)" : "") : "Set your name"; }
function askUser() {
  return new Promise(resolve => {
    const d = $("#user-dlg"); $("#user-input").value = getUser(); $("#user-manager").checked = isManager();
    d.onclose = () => {
      const v = $("#user-input").value.trim(), roleChanged = $("#user-manager").checked !== isManager();
      setManager($("#user-manager").checked); if (v) setUser(v); else renderUser();
      resolve(getUser());
      if (roleChanged) route();
    };
    d.showModal();
  });
}
async function ensureUser() { return getUser() || await askUser(); }
$("#user-btn").onclick = askUser;

// ---------- api ----------
async function api(method, path, body) {
  const headers = { "X-User": getUser() };
  if (isManager()) headers["X-Roles"] = "manager";
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const r = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  const text = await r.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch (_) { data = text; }
  if (!r.ok) { const e = new Error((data && data.message) || `${r.status}`); e.status = r.status; e.data = data; throw e; }
  return data;
}
let templatesCache = null;
const tplLabel = t => `${t.form_number} · ${t.title}${t.edition ? ` (ed. ${t.edition})` : ""}`;
// Recognition and receipts may record a template's former id.
const sameTemplate = (tpl, id) => !!tpl && (tpl.id === id || (tpl.aliases || []).includes(id));
async function templates() { return templatesCache ||= await api("GET", "/v1/templates"); }

async function refreshCounts() {
  try {
    const [cases, tasks] = await Promise.all([api("GET", "/v1/cases?limit=1"), api("GET", "/v1/tasks?limit=1")]);
    const c = Object.fromEntries(cases.counts.map(x => [x.key, x.count]));
    const t = Object.fromEntries(tasks.counts.map(x => [x.status, x.count]));
    $("#counts").replaceChildren(
      getUser() ? el("a", { class: "pill info", href: "#/", text: `${cases.mine} mine`, style: "text-decoration:none" }) : null,
      el("span", { class: "pill", text: `${c.open || 0} unassigned` }),
      el("span", { class: "pill warn", text: `${c.awaiting_response || 0} awaiting response` }),
      cases.overdue ? el("a", { class: "pill flag", href: "#/", onclick: e => { e.preventDefault(); worklistState.tab = "overdue"; if ((location.hash || "#/") === "#/") route(); else location.hash = "#/"; }, text: `${cases.overdue} overdue`, style: "text-decoration:none" }) : null,
      el("a", { class: "pill flag", href: "#/receipting", text: `${(t.open || 0) + (t.in_progress || 0)} to receipt`, style: "text-decoration:none" }));
  } catch (_) {}
}
function setNav(k) {
  for (const a of document.querySelectorAll("#nav a")) {
    if (a.dataset.nav === k) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
}
// Receipting opened from a case returns there.

        case "letter_held": return `${LETTER[x.kind] || x.kind} held — ${x.reason}`;

        case "letter_failed": return `${LETTER[x.kind] || x.kind} ${x.channel} delivery failed — ${x.error}`;
        case "finding_reviewed": return `Finding ${x.disposition || "review cleared"}: ${x.summary || RULE[x.rule] || x.rule}${x.note ? ` — ${x.note}` : ""}`;
        case "note": return "Note";
        default: return e.action.replace(/_/g, " ");
      }
    };
    return el("div", { class: "section" },
      el("div", {}, text, el("div", { style: "margin-top:6px" }, el("button", { text: "Add note", disabled: !user, onclick: async () => {
        if (!text.value.trim()) return;
        try { await api("POST", `/v1/cases/${id}/notes`, { text: text.value }); renderPane(); } catch (e) { toast(e.message); }
      } }))),
      el("ul", { class: "timeline" }, h.slice().reverse().map(e => el("li", {},
        el("span", { class: "when", text: `${fmtDate(e.at)}${e.actor ? " · " + e.actor : ""}` }),
        el("span", { text: describe(e) }),
        e.action === "note" ? el("div", { class: "note", text: e.details.text }) : null))));
  }

  renderPane();
  loadDoc();
}

// ---------- workload ----------
async function approveRequest(q) {
  const note = await askReason("Approve request", `${q.worker}: ${REQUEST[q.kind]} ${q.receipt_number}. Note (optional):`, 0);
  if (note === null) return false;
  const send = force => api("POST", `/v1/workload/requests/${q.id}/approve`, { note: note || null, force });
  try { await send(false); }
  catch (e) {
    if (e.status === 409 && e.data && e.data.error === "over_capacity" && confirm(`${e.message}. Approve anyway?`)) await send(true);
    else throw e;
  }
}
async function denyRequest(q) {
  const note = await askReason("Deny request", `${q.worker}: ${REQUEST[q.kind]} ${q.receipt_number}. Note for the worker (optional):`, 0);
  if (note === null) return false;
  await api("POST", `/v1/workload/requests/${q.id}/deny`, { note: note || null });
}
async function workload() {
  const app = $("#app");
  const user = getUser(), mgr = isManager();
  const b = await benefits();
  const names = Object.fromEntries(b.benefit.map(x => [x.form_type, x.name]));
  const body = el("div", { style: "display:grid;gap:16px" });
  app.replaceChildren(el("div", { class: "queue" }, body));
  const act = async (fn, okMsg) => { try { if (await fn() === false) return; if (okMsg) toast(okMsg); render(); refreshCounts(); } catch (e) { toast(e.message); } };
  const section = (title, ...children) => el("div", { style: "display:grid;gap:8px" }, el("div", { class: "toolbar", style: "margin:0" }, el("strong", { text: title }), el("div", { class: "grow" }), ...children.slice(0, -1)), children[children.length - 1]);
  const skillsText = s => s.map(f => names[f] || f).join(", ") || "none";
  const reqTable = (items, manage) => items.length ? el("table", {},
    el("thead", {}, el("tr", {}, ["Receipt", "Worker", "Request", "Reason", "Status", ""].map(h => el("th", { text: h })))),
    el("tbody", {}, items.map(q => el("tr", { onclick: () => location.hash = `#/cases/${q.case_id}` },
      el("td", {}, el("span", { class: "receipt", text: q.receipt_number }), el("div", { class: "muted", text: `${names[q.form_type] || q.form_type}${q.assignee ? " · " + q.assignee : " · unassigned"}` })),
      el("td", { text: q.worker }), el("td", { text: REQUEST[q.kind] }),
      el("td", { class: "muted", text: q.reason || "" }),
      el("td", {}, el("span", { class: "pill " + ({ pending: "info", approved: "ok", denied: "flag" }[q.status] || ""), text: q.status }),
        q.resolution_note ? el("div", { class: "muted", text: q.resolution_note }) : null),
      el("td", { onclick: e => e.stopPropagation() },
        q.status === "pending" && manage ? [el("button", { class: "ok", text: "Approve", onclick: () => act(() => approveRequest(q), "Approved") }), " ",
          el("button", { class: "danger", text: "Deny", onclick: () => act(() => denyRequest(q), "Denied") })] : null,
        q.status === "pending" && q.worker === user ? el("button", { class: "link", text: "Withdraw", onclick: () => act(() => api("POST", `/v1/workload/requests/${q.id}/withdraw`), "Withdrawn") }) : null))))) :
    el("div", { class: "empty", text: "No requests." });

  async function editWorker(w) {
    const name = el("input", { type: "text", maxlength: "64", value: w ? w.worker : "", disabled: !!w });
    const max = el("input", { type: "text", inputmode: "numeric", value: w ? String(w.max_cases) : "10" });
    const auto = el("input", { type: "checkbox", checked: w ? w.auto_assign : true });
    const skills = b.benefit.map(x => el("input", { type: "checkbox", value: x.form_type, checked: !!w && w.skills.includes(x.form_type) }));
    const v = await formDialog(w ? `Worker ${w.worker}` : "Add worker", [
      ["name", "Name", name], ["max", "Max cases", max],
      ["auto", "Automatic assignment", el("label", {}, auto, " receive cases from rules")],
      ["skills", "Skilled for", el("div", { class: "doclist" }, skills.map((c, i) => el("label", {}, c, b.benefit[i].name)))]]);
    if (!v) return false;
    const n = name.value.trim();
    if (!n) { toast("Enter a name."); return false; }
    await api("PUT", `/v1/workload/workers/${encodeURIComponent(n)}`, {
      max_cases: parseInt(max.value, 10), auto_assign: auto.checked, skills: skills.filter(c => c.checked).map(c => c.value) });
  }
  async function reassignAll(w) {
    const d = await api("GET", `/v1/cases?assignee=${encodeURIComponent(w.worker)}&limit=500`);
    if (!d.items.length) { toast(`${w.worker} holds no cases.`); return false; }
    const byForm = {};
    for (const c of d.items) (byForm[c.form_type] ||= []).push(c.id);
    for (const [ft, ids] of Object.entries(byForm)) if (await assignDialog(ids, ft) === false) return false;
  }
  async function editRule(r) {
    const name = el("input", { type: "text", maxlength: "200", value: r ? r.name : "" });
    const form = el("select", {}, b.benefit.map(x => el("option", { value: x.form_type, text: x.name, selected: r && r.form_type === x.form_type })));
    const pool = el("input", { type: "text", placeholder: "Empty = every skilled worker", value: r ? r.workers.join(", ") : "" });
    const prio = el("input", { type: "text", inputmode: "numeric", value: r ? String(r.priority) : "100" });
    const on = el("input", { type: "checkbox", checked: r ? r.enabled : true });
    const v = await formDialog(r ? "Edit rule" : "Add assignment rule", [
      ["name", "Name", name], ["form", "Benefit", form], ["pool", "Workers", pool],
      ["prio", "Priority (lower first)", prio], ["on", "Enabled", el("label", {}, on, " assign automatically")]]);
    if (!v) return false;
    const payload = { name: name.value, form_type: form.value, workers: pool.value.split(",").map(x => x.trim()).filter(Boolean), priority: parseInt(prio.value, 10), enabled: on.checked };
    if (r) await api("PUT", `/v1/workload/rules/${r.id}`, payload); else await api("POST", "/v1/workload/rules", payload);
  }

  async function render() {
    const [ws, rules, mineReqs, pending] = await Promise.all([
      workers(true), api("GET", "/v1/workload/rules"),
      user ? api("GET", "/v1/workload/requests?status=all&worker=me&limit=50") : [],
      mgr ? api("GET", "/v1/workload/requests") : []]).catch(e => { toast(e.message); return [[], [], [], []]; });
    const me = ws.find(w => w.worker === user);
    const parts = [];
    parts.push(section("My workload", me
      ? el("div", { class: "action" },
          el("div", {}, el("strong", { text: `${me.load} of ${me.max_cases} cases` }), me.load >= me.max_cases ? el("span", { class: "pill warn", text: "full" }) : null,
            el("span", { class: "muted", text: me.auto_assign ? " · automatic assignment on" : " · automatic assignment off" })),
          el("div", { class: "muted", text: "Skilled for: " + skillsText(me.skills) }),
          el("div", {}, el("a", { href: "#/", text: "Open my cases" })))
      : el("div", { class: "empty", text: user ? "You are not registered as a worker. A manager can add you." : "Set your name to see your workload." })));
    if (user) parts.push(section("My requests", reqTable(mineReqs, false)));
    if (mgr) {
      parts.push(section(`Pending requests (${pending.length})`, reqTable(pending, true)));
      parts.push(section("Workers",
        el("button", { text: "Add worker", onclick: () => act(() => editWorker(null), "Worker saved") }),
        ws.length ? el("table", {},
          el("thead", {}, el("tr", {}, ["Worker", "Load", "Skills", "Automatic", ""].map(h => el("th", { text: h })))),
          el("tbody", {}, ws.map(w => el("tr", { onclick: () => act(() => editWorker(w), "Worker saved") },
            el("td", { text: w.worker }),
            el("td", {}, `${w.load} / ${w.max_cases} `, w.load >= w.max_cases ? el("span", { class: "pill warn", text: "full" }) : null,
              w.pending_requests ? el("span", { class: "pill info", text: `${w.pending_requests} request(s)` }) : null),
            el("td", { text: skillsText(w.skills) }),
            el("td", { text: w.auto_assign ? "on" : "off" }),
            el("td", { onclick: e => e.stopPropagation() },
              el("button", { text: "Reassign cases", disabled: !w.load, onclick: () => act(() => reassignAll(w), "Reassigned") }), " ",
              el("button", { class: "danger", text: "Remove", onclick: () => { if (confirm(`Remove worker ${w.worker}?`)) act(() => api("DELETE", `/v1/workload/workers/${encodeURIComponent(w.worker)}`), "Removed"); } })))))) :
          el("div", { class: "empty", text: "No workers. Add workers and their skills before creating rules." })));
      parts.push(section("Assignment rules",
        el("button", { text: "Run assignment now", onclick: () => act(async () => { const r = await api("POST", "/v1/workload/sweep"); toast(`${r.assigned} case(s) assigned`); }, null) }),
        el("button", { text: "Add rule", onclick: () => act(() => editRule(null), "Rule saved") }),
        rules.length ? el("table", {},
          el("thead", {}, el("tr", {}, ["Rule", "Benefit", "Workers", "Priority", "Status", ""].map(h => el("th", { text: h })))),
          el("tbody", {}, rules.map(r => el("tr", { onclick: () => act(() => editRule(r), "Rule saved") },
            el("td", { text: r.name }), el("td", { text: names[r.form_type] || r.form_type }),
            el("td", { class: r.workers.length ? "" : "muted", text: r.workers.join(", ") || "every skilled worker" }),
            el("td", { text: String(r.priority) }),
            el("td", {}, el("span", { class: "pill " + (r.enabled ? "ok" : ""), text: r.enabled ? "enabled" : "disabled" })),
            el("td", { onclick: e => e.stopPropagation() },
              el("button", { class: "danger", text: "Delete", onclick: () => { if (confirm(`Delete rule ${r.name}?`)) act(() => api("DELETE", `/v1/workload/rules/${r.id}`), "Deleted"); } })))))) :
          el("div", { class: "empty", text: "No rules: new cases stay unassigned until a manager assigns them." })));
    } else {
      parts.push(section("Assignment rules", rules.length ? el("table", {},
        el("thead", {}, el("tr", {}, ["Rule", "Benefit", "Workers", "Priority"].map(h => el("th", { text: h })))),
        el("tbody", {}, rules.filter(r => r.enabled).map(r => el("tr", {},
          el("td", { text: r.name }), el("td", { text: names[r.form_type] || r.form_type }),
          el("td", { text: r.workers.join(", ") || "every skilled worker" }), el("td", { text: String(r.priority) }))))) :
        el("div", { class: "empty", text: "No assignment rules." })));
    }
    body.replaceChildren(...parts);
  }
  await render();
}

renderUser();
route();
</script>
</body>
</html>
