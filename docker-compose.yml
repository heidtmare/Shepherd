name: shepherd

x-blob-env: &blob-env
  BLOB_BACKEND: s3
  BLOB_BUCKET: shepherd-documents
  BLOB_ENDPOINT: http://s3:9000
  BLOB_ALLOW_HTTP: "true"
  BLOB_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-shepherd}
  BLOB_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-shepherd-dev-secret}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: shepherd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shepherd"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object store (RustFS). Any S3 endpoint works; set BLOB_* accordingly.
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-shepherd}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-shepherd-dev-secret}
    volumes:
      - s3-data:/data
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      s3: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-shepherd}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-shepherd-dev-secret}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://s3:9000 s3api head-bucket --bucket shepherd-documents 2>/dev/null
        || aws --endpoint-url http://s3:9000 s3api create-bucket --bucket shepherd-documents

  nats:
    image: nats:2.15-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Applies the JetStream topology; other services wait for it to be healthy.
  shepherd-stream:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: shepherd-stream }
    image: shepherd-stream:dev
    environment:
      BIND_ADDR: 0.0.0.0:8084
      NATS_URL: nats://nats:4222
      TOPOLOGY_PATH: /app/config/topology.toml
      ADMIN_TOKEN: ${STREAM_ADMIN_TOKEN:-dev-admin-token}
      CORS_ALLOWED_ORIGINS: http://localhost:8083,http://localhost:8085
      RUST_LOG: ${RUST_LOG:-info,ort=warn}
    ports: ["8084:8084"]
    depends_on:
      nats: { condition: service_healthy }

  shepherd-storage:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: shepherd-storage }
    image: shepherd-storage:dev
    environment:
      <<: *blob-env
      BIND_ADDR: 0.0.0.0:8081
      DATABASE_URL: postgres://storage_rw:storage@postgres:5432/shepherd
      NATS_URL: nats://nats:4222
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      shepherd-stream: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }

  shepherd-search:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: shepherd-search }
    image: shepherd-search:dev
    environment:
      <<: *blob-env
      BIND_ADDR: 0.0.0.0:8082
      DATABASE_URL: postgres://search_rw:search@postgres:5432/shepherd
      NATS_URL: nats://nats:4222
      MAPPING_PATH: /app/config/mapping.toml
      CONTENT_SOURCE: blob
      ADMIN_TOKEN: ${SEARCH_ADMIN_TOKEN:-dev-admin-token}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      shepherd-stream: { condition: service_healthy }
      # Indexer reads storage.* tables; start after storage has migrated.
      shepherd-storage: { condition: service_healthy }

  # One-time download of the handwriting model into the `models` volume (~1.3 GB).
  models-init:
    image: curlimages/curl:8.16.0
    user: "0:0"
    volumes:
      - models:/models
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        d=/models/trocr-base-handwritten; mkdir -p $$d
        for f in onnx/encoder_model.onnx onnx/decoder_model.onnx tokenizer.json; do
          out=$$d/$$(basename $$f)
          [ -s $$out ] && continue
          echo "downloading $$f"
          curl -fsSL -o $$out.part "https://huggingface.co/$${TROCR_REPO:-Xenova/trocr-base-handwritten}/resolve/main/$$f"
          mv $$out.part $$out
        done
        chmod -R a+rX /models

  # Upload form at http://localhost:8083
  shepherd-intake:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: shepherd-intake }
    image: shepherd-intake:dev
    environment:
      BIND_ADDR: 0.0.0.0:8083
      NATS_URL: nats://nats:4222
      STORAGE_URL: http://shepherd-storage:8081
      PUBLIC_STORAGE_URL: http://localhost:8081
      PUBLIC_SEARCH_URL: http://localhost:8082
      PUBLIC_STREAM_URL: http://localhost:8084
      PUBLIC_WORKBENCH_URL: http://localhost:8085
      FORMS_DIR: /app/forms
      PDFIUM_LIB_DIR: /app/lib
      HTR_MODEL_DIR: /models/trocr-base-handwritten
      RUST_LOG: ${RUST_LOG:-info,ort=warn}
    volumes:
      - models:/models:ro
    ports: ["8083:8083"]
    depends_on:
      shepherd-stream: { condition: service_healthy }
      shepherd-storage: { condition: service_healthy }
      models-init: { condition: service_completed_successfully }

  # Case adjudication and receipting workbench at http://localhost:8085
  shepherd-workbench:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: shepherd-workbench }
    image: shepherd-workbench:dev
    environment:
      BIND_ADDR: 0.0.0.0:8085
      DATABASE_URL: postgres://workbench_rw:workbench@postgres:5432/shepherd
      NATS_URL: nats://nats:4222
      STORAGE_URL: http://shepherd-storage:8081
      INTAKE_URL: http://shepherd-intake:8083
      SEARCH_URL: http://shepherd-search:8082
      NOTIFICATION_URL: http://shepherd-notification:8086
      INFERENCE_URL: http://shepherd-inference:8087
      BENEFITS_PATH: /app/config/benefits.toml
      FORMS_DIR: /app/forms
      PDFIUM_LIB_DIR: /app/lib
      RUST_LOG: ${RUST_LOG:-info,ort=warn}
    ports: ["8085:8085"]
    depends_on:
      postgres: { condition: service_healthy }
      shepherd-stream: { condition: service_healthy }
      shepherd-storage: { condition: service_healthy }

  # Letters (PDF), print-and-mail queue and e-mail notices.
  shepherd-notification:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: shepherd-notification }
    image: shepherd-notification:dev
    environment:
      BIND_ADDR: 0.0.0.0:8086
      DATABASE_URL: postgres://notification_rw:notification@postgres:5432/shepherd
      NATS_URL: nats://nats:4222
      STORAGE_URL: http://shepherd-storage:8081
      WORKBENCH_URL: http://shepherd-workbench:8085
      LETTERS_PATH: /app/config/letters.toml
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      EMAIL_FROM: ${EMAIL_FROM:-Shepherd Notices <notices@shepherd.invalid>}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    ports: ["8086:8086"]
    depends_on:
      postgres: { condition: service_healthy }
      shepherd-stream: { condition: service_healthy }
      shepherd-storage: { condition: service_healthy }
      mailpit: { condition: service_started }

  # Rule evaluation on case data; findings API.
  shepherd-inference:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { SERVICE: shepherd-inference }
    image: shepherd-inference:dev
    environment:
      BIND_ADDR: 0.0.0.0:8087
      DATABASE_URL: postgres://inference_rw:inference@postgres:5432/shepherd
      NATS_URL: nats://nats:4222
      STORAGE_URL: http://shepherd-storage:8081
      RULES_PATH: /app/config/rules.toml
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    ports: ["8087:8087"]
    depends_on:
      postgres: { condition: service_healthy }
      shepherd-stream: { condition: service_healthy }
      shepherd-storage: { condition: service_healthy }

  # Development SMTP server; captured mail at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025", "1025:1025"]

volumes:
  pg-data:
  s3-data:
  nats-data:
  models:
